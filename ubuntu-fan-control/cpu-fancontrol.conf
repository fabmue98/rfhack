# /etc/cpu-fancontrol.conf – Konfiguration für cpu-fancontrol
#
# Sensoren und PWM-Ausgänge anzeigen:            cpu-fancontrol list
# Ausgang des CPU-Lüfters herausfinden:          sudo cpu-fancontrol test <chip>/pwmN
# Diese Datei prüfen:                            sudo cpu-fancontrol check
# Änderungen übernehmen:                         sudo systemctl restart cpu-fancontrol

[general]
# Messintervall in Sekunden
interval = 2

# Was beim Beenden des Dienstes mit den Lüftern passiert:
#   restore = Steuerung an Mainboard/BIOS zurückgeben (Standard)
#   full    = Lüfter auf 100 % stellen
on_exit = restore


[web]
# Weboberfläche mit Live-Werten, Verlauf und Kennlinien-Editor
enabled = yes

# Adresse und Port des eingebauten Webservers. 127.0.0.1 = nur lokal erreichbar,
# von außen über den Reverse-Proxy des vorhandenen Webservers (z.B. http://server/fan/).
# 0.0.0.0 = direkt im Netz erreichbar unter http://server:8077/fan/
listen = 127.0.0.1
port = 8077

# Unterordner, unter dem die Oberfläche erreichbar ist
path = /fan

# Passwortschutz (empfohlen, wenn die Seite im Netz erreichbar ist).
# Setzen mit:  sudo cpu-fancontrol passwd
#password_hash =


[fan:cpu]
# PWM-Ausgang, an dem der CPU-Lüfter hängt: <chip>/pwmN (siehe "cpu-fancontrol list")
pwm = nct6798/pwm2

# Temperatursensor(en), mehrere durch Komma getrennt – der höchste Wert zählt.
#   auto             = CPU-Temperatur automatisch (Intel: Package, AMD: Tctl)
#   coretemp/temp1   = Angabe über die Nummer
#   k10temp/Tctl     = Angabe über die Bezeichnung (Label)
sensors = auto

# Optional: Drehzahlsensor des Lüfters – warnt im Log, wenn der Lüfter steht
#fan = nct6798/fan2

# Kennlinie: Temperatur (°C) : Drehzahl (%), dazwischen wird linear interpoliert.
# Unterhalb des ersten Punktes gilt dessen Drehzahl, oberhalb des letzten ebenso.
# Eine 0 lässt den Lüfter stehen (z.B. "35:0, 45:30, ..."), sofern er das kann.
curve = 40:25, 55:40, 70:70, 80:100

# Mindestdrehzahl in %, solange der Lüfter laufen soll
min_pwm = 20

# Anlaufdrehzahl in %, wenn der Lüfter aus dem Stillstand startet
start_pwm = 40

# Hysterese in °C: gedrosselt wird erst, wenn die Temperatur um so viel gefallen ist
hysteresis = 3

# Höchstens so viele % pro Intervall herunterregeln (hochgeregelt wird sofort)
ramp_down_step = 5

# Gleitender Mittelwert über so viele Messungen (glättet kurze Temperaturspitzen)
average = 3

# Ab dieser Temperatur (°C) läuft der Lüfter sofort mit 100 %
critical_temp = 85


# Weitere Lüfter (z.B. Gehäuselüfter) lassen sich zusätzlich regeln:
#[fan:gehaeuse]
#pwm = nct6798/pwm1
#sensors = auto
#curve = 45:30, 65:50, 80:100
#min_pwm = 25
