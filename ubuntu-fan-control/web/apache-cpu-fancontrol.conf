# cpu-fancontrol: Weboberfläche unter /fan auf allen Apache-Seiten
# Installiert nach /etc/apache2/conf-available/cpu-fancontrol.conf
# Abschalten: sudo a2disconf cpu-fancontrol && sudo systemctl reload apache2
<IfModule proxy_http_module>
    RedirectMatch 301 ^/fan$ /fan/
    ProxyPass        /fan/ http://127.0.0.1:8077/fan/
    ProxyPassReverse /fan/ http://127.0.0.1:8077/fan/
</IfModule>
