# cpu-fancontrol: Weboberfläche unter /fan
# Installiert nach /etc/nginx/snippets/cpu-fancontrol.conf. Im server { }-Block
# der Seite einbinden, unter der /fan erreichbar sein soll (z.B. der des KC-Managers):
#
#     include snippets/cpu-fancontrol.conf;
#
# danach: sudo nginx -t && sudo systemctl reload nginx
location = /fan {
    return 301 /fan/;
}
location /fan/ {
    proxy_pass http://127.0.0.1:8077;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
