name: Android Build

on:
  push:
    branches:
      - "ccr-c7da2a90-gbh7qj"
      - "main"
    paths:
      - "checkoutmate/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: checkoutmate

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (optional)
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK, release APK and release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease \
            lint

      - name: Upload debug APK (install this to test)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: checkoutmate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: checkoutmate/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB (upload this to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: checkoutmate/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            checkoutmate/app/build/reports/**
          if-no-files-found: ignore
