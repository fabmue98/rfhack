name: Tempomat App

on:
  push:
    branches:
      - "main"
      - "claude/tempomat-radio-app"
    paths:
      - "tempomat-app/**"
      - ".github/workflows/tempomat-app.yml"
  pull_request:
    paths:
      - "tempomat-app/**"
      - ".github/workflows/tempomat-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempomat-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tempomat-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APK for the radio
        uses: actions/upload-artifact@v4
        with:
          name: tempomat-app-release-apk
          path: tempomat-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempomat-app-reports
          path: tempomat-app/app/build/reports/**
          if-no-files-found: ignore
